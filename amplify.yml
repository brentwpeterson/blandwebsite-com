version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24 --skip-default-packages
        - nvm use 24
        - node -v
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
